services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pawandorder-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - pawandorder-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong!Passw0rd" -Q "SELECT 1" -C || exit 1
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  pawandorder-sql-data:
